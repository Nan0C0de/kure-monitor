apiVersion: v2
name: kure
description: Kubernetes failure diagnosis tool with AI-powered troubleshooting
type: application
kubeVersion: ">=1.20.0-0"
version: 2.3.3
appVersion: "2.3.3"
keywords:
  - kubernetes
  - monitoring
  - troubleshooting
  - security-scanning
  - ai-powered
  - pod-failure-detection
  - diagnostics
  - observability
home: https://nan0c0de.github.io/kure-monitor
sources:
  - https://github.com/Nan0C0de/kure-monitor
maintainers:
  - name: Nan0C0de
    email: igor.koricanac@gmail.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: added
      description: "Diagram tab: RBAC visualization. New Roles mode renders Roles / ClusterRoles together with their RoleBindings / ClusterRoleBindings, synthesized Permission nodes (one per apiGroup+resource tuple), and Subject nodes (User / Group / ServiceAccount). Three new endpoints: `/api/diagram/roles`, `/api/diagram/role/{ns}/{name}`, `/api/diagram/clusterrole/{name}`."
    - kind: added
      description: "Frontend: RbacSummaryModal shows synthesized Permission and Subject details (verbs, resourceNames, kind, namespace) when those nodes are clicked; real Role / ClusterRole / RoleBinding / ClusterRoleBinding nodes still open the live-manifest panel."
    - kind: changed
      description: "OPERATOR ACTION REQUIRED: backend ClusterRole expanded with `rbac.authorization.k8s.io` read permissions on `roles`, `clusterroles`, `rolebindings`, and `clusterrolebindings` (get, list). Reapply RBAC after upgrade: `kubectl apply -f k8s/rbac.yaml` (raw manifests) or `helm upgrade` (Helm). Without this the Roles mode of the Diagram tab returns HTTP 403."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/displayName: Kure - Kubernetes Failure Diagnosis
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Nan0C0de/kure-monitor
    - name: Chart Source
      url: https://github.com/Nan0C0de/kure-monitor/tree/main/helm
    - name: Documentation
      url: https://github.com/Nan0C0de/kure-monitor#readme
  artifacthub.io/maintainers: |
    - name: Nan0C0de
      email: igor.koricanac@gmail.com
  artifacthub.io/operator: false
  artifacthub.io/prerelease: false
  artifacthub.io/install: |
    helm repo add kure-monitor https://nan0c0de.github.io/kure-monitor/

    # Install Kure Monitor
    helm install kure-monitor kure-monitor/kure --version 2.3.3 \
      --create-namespace --namespace kure-system \
      --set postgresql.password="$(openssl rand -hex 24)"

    # After installation, configure LLM provider via the Admin panel
    # to enable AI-powered troubleshooting suggestions