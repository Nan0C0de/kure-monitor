apiVersion: v2
name: kure
description: Kubernetes failure diagnosis tool with AI-powered troubleshooting
type: application
kubeVersion: ">=1.20.0-0"
version: 2.4.3
appVersion: "2.4.3"
icon: "https://raw.githubusercontent.com/igor-koricanac/kure-monitor/main/docs/images/kure_monitor_logo.png"
keywords:
  - kubernetes
  - monitoring
  - troubleshooting
  - security-scanning
  - ai-powered
  - pod-failure-detection
  - diagnostics
  - observability
home: https://igor-koricanac.github.io/kure-monitor
sources:
  - https://github.com/igor-koricanac/kure-monitor
maintainers:
  - name: igor-koricanac
    email: igor.koricanac@gmail.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "Sixteen new AI Advice detectors across resource hygiene, scheduling/availability, networking, lifecycle, and storage categories. Net detector count rises from 23 to 38."
    - kind: changed
      description: "AI Advice panel replaces the 'Show dismissed' checkbox with Active / Ignored tabs (live counts, optimistic dismiss/restore, tab-aware export and WebSocket upserts)."
    - kind: fixed
      description: "Removed the 'referenced-config-missing' detector, which false-positived on every Secret reference (the backend has no Secret-read RBAC by design). Genuinely missing ConfigMap/Secret refs are already reported by the pod-watcher as CreateContainerConfigError with better evidence and timing."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/displayName: Kure - Kubernetes Failure Diagnosis
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/igor-koricanac/kure-monitor
    - name: Chart Source
      url: https://github.com/igor-koricanac/kure-monitor/tree/main/helm
    - name: Documentation
      url: https://github.com/igor-koricanac/kure-monitor#readme
  artifacthub.io/maintainers: |
    - name: igor-koricanac
      email: igor.koricanac@gmail.com
  artifacthub.io/operator: false
  artifacthub.io/prerelease: false
  artifacthub.io/install: |
    helm repo add kure-monitor https://igor-koricanac.github.io/kure-monitor/

    # Install Kure Monitor
    helm install kure-monitor kure-monitor/kure --version 2.4.3 \
      --create-namespace --namespace kure-system \
      --set postgresql.password="$(openssl rand -hex 24)"

    # After installation, configure LLM provider via the Admin panel
    # to enable AI-powered troubleshooting suggestions