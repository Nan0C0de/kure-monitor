apiVersion: v2
name: kure
description: Kubernetes failure diagnosis tool with AI-powered troubleshooting
type: application
kubeVersion: ">=1.20.0-0"
version: 2.3.2
appVersion: "2.3.2"
keywords:
  - kubernetes
  - monitoring
  - troubleshooting
  - security-scanning
  - ai-powered
  - pod-failure-detection
  - diagnostics
  - observability
home: https://nan0c0de.github.io/kure-monitor
sources:
  - https://github.com/Nan0C0de/kure-monitor
maintainers:
  - name: Nan0C0de
    email: nano.code@outlook.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: added
      description: "New Diagram tab - interactive Kubernetes topology graph with per-namespace and per-workload modes. Click any node to view its manifest; click any edge to focus on that path (highlights ancestors + descendants, dims the rest)."
    - kind: added
      description: "Backend topology service builds a deterministic graph from owner refs, label selectors, service->endpoints, ingress backends, HPA targets, NetworkPolicy selectors, and volume / envFrom references. EndpointSlice with Endpoints fallback. 15s in-memory cache. New endpoints under `/api/diagram/*` gated by `require_read`."
    - kind: changed
      description: "BREAKING for cluster operators: backend ClusterRole expanded for the topology graph. New permissions for the `kure-backend` ServiceAccount on namespaces, services, endpoints, configmaps, persistentvolumeclaims, serviceaccounts, replicasets / statefulsets / daemonsets (apps), jobs / cronjobs (batch), ingresses / networkpolicies (networking.k8s.io), endpointslices (discovery.k8s.io), and horizontalpodautoscalers (autoscaling). Reapply RBAC after upgrade: `kubectl apply -f k8s/rbac.yaml` (raw manifests) or `helm upgrade` (Helm)."
    - kind: added
      description: "Security: `secrets` is intentionally NOT granted to the backend. Secret nodes in the diagram are derived purely from workload spec references; the manifest endpoint hard-rejects `kind=Secret` with HTTP 403 by design and the UI shows a 'no read access by design' info banner."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/displayName: Kure - Kubernetes Failure Diagnosis
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Nan0C0de/kure-monitor
    - name: Chart Source
      url: https://github.com/Nan0C0de/kure-monitor/tree/main/helm
    - name: Documentation
      url: https://github.com/Nan0C0de/kure-monitor#readme
  artifacthub.io/maintainers: |
    - name: Nan0C0de
      email: nano.code@outlook.com
  artifacthub.io/operator: false
  artifacthub.io/prerelease: false
  artifacthub.io/install: |
    helm repo add kure-monitor https://nan0c0de.github.io/kure-monitor/

    # Install Kure Monitor
    helm install kure-monitor kure-monitor/kure --version 2.3.2 \
      --create-namespace --namespace kure-system

    # After installation, configure LLM provider via the Admin panel
    # to enable AI-powered troubleshooting suggestions