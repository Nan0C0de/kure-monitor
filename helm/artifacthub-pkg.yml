# Artifact Hub package metadata file
version: 2.3.3
name: kure
category: monitoring-logging
displayName: Kure - Kubernetes Failure Diagnosis
createdAt: 2026-05-09T00:00:00Z
description: |
  Kubernetes failure diagnosis tool that detects pod failures (CrashLoopBackOff, ImagePullBackOff, Pending, OOMKilled) and generates AI-powered troubleshooting solutions. Includes 50+ security checks: privileged containers, dangerous capabilities, missing seccomp/AppArmor profiles, RBAC issues, untrusted registries, and more. No Prometheus dependency required.
license: Apache-2.0
homeURL: https://github.com/Nan0C0de/kure-monitor
appVersion: "2.3.3"
containersImages:
  - name: kure-monitor-agent
    image: ghcr.io/nan0c0de/kure-monitor/agent:2.3.3
  - name: kure-monitor-backend
    image: ghcr.io/nan0c0de/kure-monitor/backend:2.3.3
  - name: kure-monitor-frontend
    image: ghcr.io/nan0c0de/kure-monitor/frontend:2.3.3
  - name: kure-monitor-security-scanner
    image: ghcr.io/nan0c0de/kure-monitor/security-scanner:2.3.3
operator: false
deprecated: false
prerelease: false
containsSecurityUpdates: true
keywords:
  - kubernetes
  - troubleshooting
  - diagnosis
  - pod-failures
  - security-scanning
  - ai-powered
links:
  - name: Chart Source
    url: https://github.com/Nan0C0de/kure-monitor/tree/main/helm
  - name: Documentation
    url: https://github.com/Nan0C0de/kure-monitor#readme
maintainers:
  - name: Nan0C0de
    email: igor.koricanac@gmail.com
provider:
  name: Nan0C0de
changes:
  - kind: added
    description: "Diagram tab: RBAC visualization. New Roles mode renders Roles / ClusterRoles together with their RoleBindings / ClusterRoleBindings, synthesized Permission nodes (one per apiGroup+resource tuple), and Subject nodes (User / Group / ServiceAccount). Three new endpoints: `/api/diagram/roles`, `/api/diagram/role/{ns}/{name}`, `/api/diagram/clusterrole/{name}`."
  - kind: added
    description: "Frontend: RbacSummaryModal shows synthesized Permission and Subject details (verbs, resourceNames, kind, namespace) when those nodes are clicked; real Role / ClusterRole / RoleBinding / ClusterRoleBinding nodes still open the live-manifest panel."
  - kind: changed
    description: "OPERATOR ACTION REQUIRED: backend ClusterRole expanded with `rbac.authorization.k8s.io` read permissions on `roles`, `clusterroles`, `rolebindings`, and `clusterrolebindings` (get, list). Reapply RBAC after upgrade: `kubectl apply -f k8s/rbac.yaml` (raw manifests) or `helm upgrade` (Helm)."
install: |
  ```bash
  helm repo add kure-monitor https://nan0c0de.github.io/kure-monitor/
  helm repo update

  # Install Kure Monitor
  helm install kure-monitor kure-monitor/kure --version 2.3.3 \
    --create-namespace --namespace kure-system

  # On first visit, the dashboard prompts you to create the initial admin account.
  # After installation, configure LLM provider via the Admin panel
  # to enable AI-powered troubleshooting suggestions.
  ```
