# Artifact Hub package metadata file
version: 2.3.4
name: kure
category: monitoring-logging
displayName: Kure - Kubernetes Failure Diagnosis
createdAt: 2026-05-10T00:00:00Z
description: |
  Kubernetes failure diagnosis tool that detects pod failures (CrashLoopBackOff, ImagePullBackOff, Pending, OOMKilled) and generates AI-powered troubleshooting solutions. Includes 50+ security checks: privileged containers, dangerous capabilities, missing seccomp/AppArmor profiles, RBAC issues, untrusted registries, and more. No Prometheus dependency required.
license: Apache-2.0
homeURL: https://github.com/Nan0C0de/kure-monitor
appVersion: "2.3.4"
containersImages:
  - name: kure-monitor-agent
    image: ghcr.io/nan0c0de/kure-monitor/agent:2.3.4
  - name: kure-monitor-backend
    image: ghcr.io/nan0c0de/kure-monitor/backend:2.3.4
  - name: kure-monitor-frontend
    image: ghcr.io/nan0c0de/kure-monitor/frontend:2.3.4
  - name: kure-monitor-security-scanner
    image: ghcr.io/nan0c0de/kure-monitor/security-scanner:2.3.4
operator: false
deprecated: false
prerelease: false
containsSecurityUpdates: false
keywords:
  - kubernetes
  - troubleshooting
  - diagnosis
  - pod-failures
  - security-scanning
  - ai-powered
links:
  - name: Chart Source
    url: https://github.com/Nan0C0de/kure-monitor/tree/main/helm
  - name: Documentation
    url: https://github.com/Nan0C0de/kure-monitor#readme
maintainers:
  - name: Nan0C0de
    email: igor.koricanac@gmail.com
provider:
  name: Nan0C0de
changes:
  - kind: changed
    description: "Default LLM provider switched from Ollama to Groq. New users land on Groq pre-selected in the AI Configuration panel."
  - kind: changed
    description: "Model lists refreshed across all providers (May 2026 latest). OpenAI: GPT-5.5 / GPT-5.5 Mini (default) / GPT-5.4 Mini. Anthropic: Claude Opus 4.7 / Sonnet 4.6 (default) / Haiku 4.5. Gemini: 3.1 Pro / 3 Flash (default) / 3.1 Flash Lite. Groq: Llama 4 Maverick / Llama 4 Scout (default) / GPT-OSS 120B / Kimi K2. Ollama: Llama 4 Scout (default) / Llama 3.3 / Qwen 3. GitHub Copilot: openai/gpt-5.5 / openai/gpt-5.5-mini (default) / anthropic/claude-sonnet-4-6."
install: |
  ```bash
  helm repo add kure-monitor https://nan0c0de.github.io/kure-monitor/
  helm repo update

  # Install Kure Monitor
  helm install kure-monitor kure-monitor/kure --version 2.3.4 \
    --create-namespace --namespace kure-system \
    --set postgresql.password="$(openssl rand -hex 24)"

  # On first visit, the dashboard prompts you to create the initial admin account.
  # After installation, configure LLM provider via the Admin panel
  # to enable AI-powered troubleshooting suggestions.
  ```
