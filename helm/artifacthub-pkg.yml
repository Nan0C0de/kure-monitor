# Artifact Hub package metadata file
version: 2.4.4
name: kure
category: monitoring-logging
displayName: Kure - Kubernetes Failure Diagnosis
createdAt: 2026-07-23T00:00:00Z
description: |
  Kubernetes failure diagnosis tool that detects pod failures (CrashLoopBackOff, ImagePullBackOff, Pending, OOMKilled) and generates AI-powered troubleshooting solutions. Includes 50+ security checks and the AI Advice tab — 38 proactive detectors that spot architectural mismatches (scaling, reliability, networking, data, config, capacity, scheduling, supply-chain, startup, resource hygiene, lifecycle, storage) across two layers. The four dashboard features (Pod Monitoring, Security Scan, Diagram, AI Advice) are individually toggleable via helm values. No Prometheus dependency required.
license: Apache-2.0
homeURL: https://github.com/igor-koricanac/kure-monitor
appVersion: "2.4.4"
containersImages:
  - name: kure-monitor-agent
    image: ghcr.io/igor-koricanac/kure-monitor/agent:2.4.4
  - name: kure-monitor-backend
    image: ghcr.io/igor-koricanac/kure-monitor/backend:2.4.4
  - name: kure-monitor-frontend
    image: ghcr.io/igor-koricanac/kure-monitor/frontend:2.4.4
  - name: kure-monitor-security-scanner
    image: ghcr.io/igor-koricanac/kure-monitor/security-scanner:2.4.4
operator: false
deprecated: false
prerelease: false
containsSecurityUpdates: false
keywords:
  - kubernetes
  - troubleshooting
  - diagnosis
  - pod-failures
  - security-scanning
  - ai-powered
  - ai-advice
  - architectural-detectors
links:
  - name: Chart Source
    url: https://github.com/igor-koricanac/kure-monitor/tree/main/helm
  - name: Documentation
    url: https://github.com/igor-koricanac/kure-monitor#readme
maintainers:
  - name: igor-koricanac
    email: igor.koricanac@gmail.com
provider:
  name: igor-koricanac
changes:
  - kind: added
    description: "Local AI Auto-Discovery: Automatically scans Kubernetes services for local LLMs (Ollama, vLLM, LocalAI, NIM) and retrieves available models."
  - kind: changed
    description: "Flexible Custom Provider: Replaced rigid AI dropdowns with a unified Custom provider supporting any OpenAI-compatible API and free-text model entry."
  - kind: changed
    description: "UI & Branding: Official logo integrated into dashboard, login screens, and docs; enforced mandatory light theme."
  - kind: changed
    description: "Infrastructure: NodeJS 24 test environment, updated helmrelease pipelines, repository migration, and completely removed restrictive network policies to simplify cluster integration."
install: |
  ```bash
  helm repo add kure-monitor https://igor-koricanac.github.io/kure-monitor/
  helm repo update

  # Install Kure Monitor
  helm install kure-monitor kure-monitor/kure --version 2.4.4 \
    --create-namespace --namespace kure-system \
    --set postgresql.password="$(openssl rand -hex 24)"

  # On first visit, the dashboard prompts you to create the initial admin account.
  # After installation, configure LLM provider via the Admin panel
  # to enable AI-powered troubleshooting suggestions.
  ```
