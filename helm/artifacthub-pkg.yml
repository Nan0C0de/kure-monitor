# Artifact Hub package metadata file
version: 2.4.0
name: kure
category: monitoring-logging
displayName: Kure - Kubernetes Failure Diagnosis
createdAt: 2026-05-13T00:00:00Z
description: |
  Kubernetes failure diagnosis tool that detects pod failures (CrashLoopBackOff, ImagePullBackOff, Pending, OOMKilled) and generates AI-powered troubleshooting solutions. Includes 50+ security checks and the new AI Advice tab — 23 proactive detectors that spot architectural mismatches (scaling, reliability, networking, data, config, capacity, scheduling, supply-chain, startup) across two layers. No Prometheus dependency required.
license: Apache-2.0
homeURL: https://github.com/Nan0C0de/kure-monitor
appVersion: "2.4.0"
containersImages:
  - name: kure-monitor-agent
    image: ghcr.io/nan0c0de/kure-monitor/agent:2.4.0
  - name: kure-monitor-backend
    image: ghcr.io/nan0c0de/kure-monitor/backend:2.4.0
  - name: kure-monitor-frontend
    image: ghcr.io/nan0c0de/kure-monitor/frontend:2.4.0
  - name: kure-monitor-security-scanner
    image: ghcr.io/nan0c0de/kure-monitor/security-scanner:2.4.0
operator: false
deprecated: false
prerelease: false
containsSecurityUpdates: false
keywords:
  - kubernetes
  - troubleshooting
  - diagnosis
  - pod-failures
  - security-scanning
  - ai-powered
  - ai-advice
  - architectural-detectors
links:
  - name: Chart Source
    url: https://github.com/Nan0C0de/kure-monitor/tree/main/helm
  - name: Documentation
    url: https://github.com/Nan0C0de/kure-monitor#readme
maintainers:
  - name: Nan0C0de
    email: igor.koricanac@gmail.com
provider:
  name: Nan0C0de
changes:
  - kind: added
    description: "AI Advice tab — 23 proactive architectural-mismatch detectors across two layers. 20 work without extra infra; 3-4 require Cilium Hubble (stub client; UI shows a Needs Hubble badge)."
  - kind: added
    description: "Detector Settings admin modal: per-detector enable/disable, grouped by category, with search and bulk actions. Findings export to JSON or CSV. Lazy-rendered findings list."
  - kind: changed
    description: "LLM-cost optimization: scans persist findings with explanation=null and lazily generate explanations on card expand via POST /api/advice/findings/{id}/explain (cached, idempotent)."
  - kind: changed
    description: "PostgreSQL resources renamed with kure-monitor- prefix. Existing PVC is orphaned (rebuild-empty migration plan)."
  - kind: changed
    description: "Role consolidation: admin/write/read -> admin/member. Idempotent migration auto-maps existing users on first boot."
  - kind: changed
    description: "Login rate limiting moved from in-memory dict to DB-backed login_attempts table so replicas share state."
  - kind: changed
    description: "Agent WebSocket auth defaults to X-Service-Token header instead of ?token= query param. Exponential backoff with jitter on WS reconnects."
install: |
  ```bash
  helm repo add kure-monitor https://nan0c0de.github.io/kure-monitor/
  helm repo update

  # Install Kure Monitor
  helm install kure-monitor kure-monitor/kure --version 2.4.0 \
    --create-namespace --namespace kure-system \
    --set postgresql.password="$(openssl rand -hex 24)"

  # On first visit, the dashboard prompts you to create the initial admin account.
  # After installation, configure LLM provider via the Admin panel
  # to enable AI-powered troubleshooting suggestions.
  ```
