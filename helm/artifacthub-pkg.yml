# Artifact Hub package metadata file
version: 2.4.1
name: kure
category: monitoring-logging
displayName: Kure - Kubernetes Failure Diagnosis
createdAt: 2026-05-20T00:00:00Z
description: |
  Kubernetes failure diagnosis tool that detects pod failures (CrashLoopBackOff, ImagePullBackOff, Pending, OOMKilled) and generates AI-powered troubleshooting solutions. Includes 50+ security checks and the AI Advice tab — 23 proactive detectors that spot architectural mismatches (scaling, reliability, networking, data, config, capacity, scheduling, supply-chain, startup) across two layers. The four dashboard features (Pod Monitoring, Security Scan, Diagram, AI Advice) are now individually toggleable via helm values. No Prometheus dependency required.
license: Apache-2.0
homeURL: https://github.com/Nan0C0de/kure-monitor
appVersion: "2.4.1"
containersImages:
  - name: kure-monitor-agent
    image: ghcr.io/nan0c0de/kure-monitor/agent:2.4.1
  - name: kure-monitor-backend
    image: ghcr.io/nan0c0de/kure-monitor/backend:2.4.1
  - name: kure-monitor-frontend
    image: ghcr.io/nan0c0de/kure-monitor/frontend:2.4.1
  - name: kure-monitor-security-scanner
    image: ghcr.io/nan0c0de/kure-monitor/security-scanner:2.4.1
operator: false
deprecated: false
prerelease: false
containsSecurityUpdates: false
keywords:
  - kubernetes
  - troubleshooting
  - diagnosis
  - pod-failures
  - security-scanning
  - ai-powered
  - ai-advice
  - architectural-detectors
links:
  - name: Chart Source
    url: https://github.com/Nan0C0de/kure-monitor/tree/main/helm
  - name: Documentation
    url: https://github.com/Nan0C0de/kure-monitor#readme
maintainers:
  - name: Nan0C0de
    email: igor.koricanac@gmail.com
provider:
  name: Nan0C0de
changes:
  - kind: added
    description: "Optional feature toggles. The four dashboard features (Pod Monitoring, Security Scan, Diagram, AI Advice) can now be enabled/disabled individually via the new helm features.* values. All four default to true; disabling a feature hides its dashboard tab and skips deploying any workloads/RBAC/NetworkPolicies dedicated to it."
install: |
  ```bash
  helm repo add kure-monitor https://nan0c0de.github.io/kure-monitor/
  helm repo update

  # Install Kure Monitor
  helm install kure-monitor kure-monitor/kure --version 2.4.1 \
    --create-namespace --namespace kure-system \
    --set postgresql.password="$(openssl rand -hex 24)"

  # On first visit, the dashboard prompts you to create the initial admin account.
  # After installation, configure LLM provider via the Admin panel
  # to enable AI-powered troubleshooting suggestions.
  ```
