{{- $secretName := printf "%s-encryption" (include "kure.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $key := "" }}
{{- if .Values.security.encryptionKey }}
  {{- $key = .Values.security.encryptionKey | b64enc }}
{{- else if $existing }}
  {{- $key = index $existing.data "encryption-key" }}
{{- else }}
  {{- /* Auto-generate a Fernet-compatible key (44-char base64 of 32 random bytes) */}}
  {{- $key = randBytes 32 | b64enc | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "kure.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
data:
  encryption-key: {{ $key | quote }}

