name: Release Helm Charts

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Chart version to release'
        required: true
        default: '2.3.0'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: website/package-lock.json

    - name: Add dependency repos
      run: |
        helm repo add stable https://charts.helm.sh/stable

    - name: Update Chart version
      run: |
        sed -i "s/^version: .*/version: ${{ github.event.inputs.chart_version }}/" helm/Chart.yaml
        git add helm/Chart.yaml
        git commit -m "Update chart version to ${{ github.event.inputs.chart_version }}" || echo "No changes to commit"

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
      env:
        CR_TOKEN: "${{ secrets.GH_TOKEN }}"
      with:
        charts_dir: helm
        config: cr.yaml

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Build website
      working-directory: website
      run: |
        npm ci
        npm run build

    - name: Package chart and merge with website
      run: |
        mkdir -p .cr-release-packages

        # Package the chart
        helm package helm/ --destination .cr-release-packages/

        # Create the chart repo index pointing at the Pages URL
        helm repo index .cr-release-packages --url https://igor-koricanac.github.io/kure-monitor/

        # Cache-busting comment
        echo "# Generated at $(date)" >> .cr-release-packages/index.yaml

        # Merge helm chart artifacts into the Astro build output so existing
        # `helm repo add` URLs keep working alongside the new website.
        cp .cr-release-packages/index.yaml      website/dist/
        cp .cr-release-packages/*.tgz           website/dist/
        cp helm/artifacthub-repo.yml            website/dist/

        echo "Final website/dist contents:"
        ls -la website/dist/
        echo "--- index.yaml ---"
        cat website/dist/index.yaml

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      if: success()
      with:
        path: website/dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: success()
