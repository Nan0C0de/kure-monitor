name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: website/package-lock.json

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Build website
      working-directory: website
      run: |
        npm ci
        npm run build

    - name: Package current chart version and merge with website
      run: |
        mkdir -p .cr-release-packages

        # Re-package the chart at its CURRENT version (no bump, no GH release).
        # This keeps the Pages-hosted helm repo (index.yaml + .tgz) intact so
        # `helm repo add ...` continues to work after a website-only deploy.
        helm package helm/ --destination .cr-release-packages/
        helm repo index .cr-release-packages --url https://nan0c0de.github.io/kure-monitor/
        echo "# Generated at $(date)" >> .cr-release-packages/index.yaml

        cp .cr-release-packages/index.yaml      website/dist/
        cp .cr-release-packages/*.tgz           website/dist/
        cp helm/artifacthub-repo.yml            website/dist/

        echo "Final website/dist contents:"
        ls -la website/dist/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: website/dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
